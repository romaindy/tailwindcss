<!doctype html>
<html lang="fr"
      class="dark">
<head>
    <meta charset="UTF-8">
    <title>Exercice n°9</title>
    <link href="../dist/style.css"
          rel="stylesheet">
    <script>
        document.documentElement.classList.toggle("dark", window.matchMedia("(prefers-color-scheme: dark)").matches);

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("dark-mode-button").addEventListener("click", function () {
                document.documentElement.classList.toggle("dark");
            });
        });
    </script>
</head>
<body class="flex flex-col gap-8 min-h-screen justify-center items-center">
<article class="max-w-sm p-6 border border-stone-200 rounded-xl">
    <img class="rounded-xl"
         src="https://placehold.co/600x400?text=Juste une image"
         alt="Juste une image"/>
    <h5 class="mt-6 mb-2 text-2xl font-semibold tracking-tight">Une simple carte avec un titre sur deux lignes.</h5>
    <p class="mb-6 text-gray-600">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
        eiusmod
        tempor incididunt ut labore et dolore magna aliqua. </p>
    <a href="#"
       class="inline-flex items-center  border border-stone-200 shadow-xs font-medium leading-5 rounded-xl text-sm px-4 py-2.5">
        En savoir plus &rarr;
    </a>
</article>

<button id="dark-mode-button"
        class="inline-flex items-center  border border-stone-200 shadow-xs font-medium leading-5 rounded-xl text-sm px-4 py-2.5">
    Dark / light mode
</button>
</body>
</html>
